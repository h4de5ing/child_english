<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf9f2">
  <title>儿童英语启蒙 · 选择小乐园</title>
  <meta name="description" content="3–6 岁儿童英语启蒙，选择喜欢的小乐园，点一点、听一听、玩一玩。">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fbf9f2;color:#293f34;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:830px}.brand{font-size:13px;letter-spacing:2px;color:#708465;margin-bottom:22px}.brand span{font-size:25px;vertical-align:middle;margin-right:9px}h1{font-size:clamp(28px,5vw,40px);margin:0 0 15px;letter-spacing:1px}p{font-size:14px;line-height:1.8;color:#7a8370;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:35px 0 27px}a{display:flex;flex-direction:column;align-items:flex-start;min-height:260px;padding:30px;border:1px solid #dfe4d2;border-radius:27px;text-decoration:none;color:inherit;background:#eaf0d7;box-shadow:0 5px 0 #dde4cb;transition:transform .2s,box-shadow .2s}a.claude{background:#f9ead6;border-color:#eddec8;box-shadow:0 5px 0 #eadcc8}a:hover{transform:translateY(-4px);box-shadow:0 10px 24px #35463214}a:focus-visible{outline:3px solid #5577bd;outline-offset:5px}.illustration{font-size:48px;line-height:1.2;margin-bottom:20px}h2{font-size:23px;margin:0 0 9px}.version{font-size:11px;letter-spacing:1px;color:#718361;margin-bottom:15px}.enter{display:flex;align-items:center;justify-content:space-between;align-self:stretch;margin-top:auto;padding-top:20px;font-size:13px;font-weight:700}.enter span{font-size:23px}.note{font-size:12px;text-align:center;color:#939985}@media(max-width:540px){.choices{grid-template-columns:1fr;gap:19px;margin:27px 0}.choices a{min-height:215px;padding:25px}.illustration{font-size:40px;margin-bottom:13px}body{padding-top:35px;padding-bottom:35px}h2{font-size:21px}}@media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span aria-hidden="true">🌱</span> LITTLE ENGLISH WORLD</div>
    <h1>选一个小乐园，开始探索吧。</h1>
    <p>3–6 岁英语启蒙 · 点一点，听一听，在玩耍中认识新世界。</p>
    <div class="choices">
      <a href="./src_codex/index.html">
        <div class="illustration" aria-hidden="true">🐰 🌿</div>
        <div class="version">CODEX VERSION</div>
        <h2>芽芽英语</h2>
        <p>跟着芽芽，发现六个英语小世界。</p>
        <div class="enter">进入 Codex 版本 <span aria-hidden="true">→</span></div>
      </a>
      <a class="claude" href="./src_claude/index.html">
        <div class="illustration" aria-hidden="true">🦁 ☀️</div>
        <div class="version">CLAUDE VERSION</div>
        <h2>Hello English</h2>
        <p>打开英语乐园，开始今天的小冒险。</p>
        <div class="enter">进入 Claude 版本 <span aria-hidden="true">→</span></div>
      </a>
    </div>
    <p class="note">每一次好奇，都是成长的开始。</p>
  </main>
</body>
</html>
