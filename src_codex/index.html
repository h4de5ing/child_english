<body>
  <header class="app-header">
    <button class="brand" data-action="home" aria-label="芽芽英语，返回探索乐园"><span class="brand-icon emoji" aria-hidden="true">🌱</span><span><strong>芽芽英语</strong><small>LITTLE SPROUT</small></span></button>
    <nav class="desktop-nav" aria-label="主导航"><button class="nav-btn active" data-action="home">探索乐园</button><button class="nav-btn" data-action="stickers">我的贴纸</button></nav>
    <button class="parent-btn" data-action="parent"><span class="parent-dot" aria-hidden="true">⌘</span>家长入口</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="app-footer"><span>每一次好奇，都在悄悄长大。 🌱</span><span>LITTLE SPROUT · 在玩耍中，遇见英语</span></footer>
  <nav class="mobile-nav" aria-label="底部导航"><button class="active" data-action="home"><span class="nav-icon emoji" aria-hidden="true">🏡</span>探索乐园</button><button data-action="stickers"><span class="nav-icon emoji" aria-hidden="true">⭐</span>我的贴纸</button><button data-action="parent"><span class="nav-icon emoji" aria-hidden="true">🌱</span>家长入口</button></nav>
  <dialog class="modal" id="modal" aria-labelledby="modal-title"><div class="modal-inner" id="modal-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
  <script src="./topics.js"></script>
  <script>
    'use strict';
    const TOPICS = window.LITTLE_SPROUT_TOPICS;
    const TOTAL_WORDS = TOPICS.reduce((sum,topic)=>sum+topic.words.length,0);
    const PAGE_SIZE = 6;
    const app = document.getElementById('app');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    const STORAGE_KEY = 'little-sprout-prototype-v1';
    let state = {heard:{},stickers:[],sound:true,age:'3-4',lastTopic:'animals',learningMode:'sequential',quizCursor:{}};
    let lessonOrder = [], lessonPage = 0, lessonModeDirty = false;
    let currentView = 'home', activeTopic = TOPICS[0], quiz = null, pendingInstall = null;
    let toastTimer, speakingTimer, speechToken = 0, gateAnswer = 0, returnFocus = null;
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{toast('当前浏览器无法保存进度，本次仍然可以继续玩。');}}
    function heardCount(topic){return (state.heard[topic.id] || []).length;}
    function totalHeard(){return TOPICS.reduce((sum,topic)=>sum+heardCount(topic),0);}
    function progressDots(n){return '<small>已探索 '+n+' / '+activeTopic.words.length+' 个单词</small>';}
    function picture(word){
      const visual=word[2];
      if(visual.startsWith('#'))return '<span class="color-dot" style="--swatch:'+visual+'" aria-hidden="true"></span>';
      if(visual.startsWith('shape:'))return '<span class="shape '+visual.slice(6)+'" aria-hidden="true"></span>';
      if(visual.startsWith('number:')){const n=Number(visual.slice(7));return '<span class="number-picture" aria-hidden="true"><b>'+n+'</b><span class="count-dots">'+Array.from({length:n},()=>'<i></i>').join('')+'</span></span>';}
      return '<span class="emoji" aria-hidden="true">'+visual+'</span>';
    }
    function modeLabel(){return state.learningMode==='random'?'随机学习':'顺序学习';}
    function nextTopicId(fromCurrent=false){
      if(state.learningMode==='random')return shuffle(TOPICS.filter(t=>t.id!==(fromCurrent?activeTopic.id:state.lastTopic)))[0].id;
      return fromCurrent?TOPICS[(TOPICS.findIndex(t=>t.id===activeTopic.id)+1)%TOPICS.length].id:state.lastTopic;
    }
    function toast(message){clearTimeout(toastTimer);const box=document.getElementById('toast');box.textContent=message;box.hidden=false;toastTimer=setTimeout(()=>box.hidden=true,4200);}
    function nav(view){document.querySelectorAll('nav [data-action]').forEach(button=>{const selected=button.dataset.action===view;button.classList.toggle('active',selected);if(selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});}
    function beginView(view){stopSpeech();currentView=view;quiz=null;nav(view==='stickers'?'stickers':'home');app.classList.remove('view-enter');window.scrollTo(0,0);}
    function endView(){app.classList.add('view-enter');app.focus({preventScroll:true});}
    function renderHome(){
      beginView('home');
      app.innerHTML = '<section class="hero"><div class="hero-copy"><div class="eyebrow">HELLO, LITTLE EXPLORER</div><h1>小小手指，<br>探索大大世界。</h1><p>点一点，听一听。<br class="mobile-break">和芽芽一起，发现英语的乐趣。</p><button class="primary" data-action="start">一起去探索 <span class="arrow" aria-hidden="true">→</span></button></div><div class="hero-art" aria-hidden="true"><div class="hill"></div><div class="hill back"></div><div class="sun"></div><div class="cloud"></div><div class="hello">Hello!</div><div class="bunny"><div class="body"></div><div class="ear"></div><div class="ear right"></div><div class="face"><i class="eye"></i><i class="eye right"></i><i class="cheek"></i><i class="cheek right"></i><i class="nose"></i><i class="mouth"></i></div><div class="bib">✿</div></div><div class="float-card apple"><span class="emoji">🍎</span>apple</div><div class="float-card car"><span class="emoji">🚙</span>car</div><span class="spark s1">✧</span><span class="spark s2">✿</span><span class="grass">〃</span></div></section>'+
      '<div class="daily"><div class="daily-left"><span class="emoji" aria-hidden="true">☀️</span><span>每天一点点，好奇多一点</span><span class="small">· 轻松玩一会儿</span></div><div class="daily-stars"><span class="emoji" aria-hidden="true">⭐</span><span>我的小贴纸 <b>'+state.stickers.length+'</b> / '+TOPICS.length+'</span></div></div>'+
      '<section aria-labelledby="topics-title"><div class="section-heading"><div><h2 id="topics-title">今天，想去哪里玩？</h2><p>选一个喜欢的小世界，点开就能玩</p></div><span class="count">'+TOPICS.length+' 个主题 · '+TOTAL_WORDS+' 个单词</span></div><div class="topic-grid">'+TOPICS.map((t,i)=>'<button class="topic-card" data-action="topic" data-topic="'+t.id+'" aria-label="探索'+t.zh+'，'+t.en+'"><div class="topic-art" style="--tint:'+t.tint+'"><span class="topic-badge">WORLD '+String(i+1).padStart(2,'0')+'</span><span class="orbit"></span><span class="emoji tiny" aria-hidden="true">'+t.tiny+'</span><span class="emoji" aria-hidden="true">'+t.icon+'</span><span class="emoji side" aria-hidden="true">'+t.side+'</span></div><div class="topic-info"><div><h3>'+t.zh+'</h3><small class="'+(state.stickers.includes(t.id)?'topic-done':'')+'">'+t.en+' · '+(state.stickers.includes(t.id)?'贴纸已点亮 ✓':heardCount(t)?'已探索 '+heardCount(t)+' / '+t.words.length:t.words.length+' 个新单词')+'</small></div><span class="card-arrow" aria-hidden="true">↗</span></div></button>').join('')+'</div></section>'+
      '<div class="home-note"><span>♬ 听一听</span><span>☝ 点一点</span><span>✧ 每个发现都值得鼓励</span></div>';
      endView();
    }
    function stopSpeech(){speechToken++;clearTimeout(speakingTimer);if('speechSynthesis' in window)window.speechSynthesis.cancel();document.querySelectorAll('.speaking').forEach(el=>el.classList.remove('speaking'));}
    function loadState(){
      try{
        const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));
        if(!stored || typeof stored!=='object')return;
        if(typeof stored.sound==='boolean')state.sound=stored.sound;
        if(['3-4','5-6'].includes(stored.age))state.age=stored.age;
        if(['sequential','random'].includes(stored.learningMode))state.learningMode=stored.learningMode;
        if(TOPICS.some(t=>t.id===stored.lastTopic))state.lastTopic=stored.lastTopic;
        if(Array.isArray(stored.stickers))state.stickers=[...new Set(stored.stickers.filter(id=>TOPICS.some(t=>t.id===id)))];
        for(const topic of TOPICS){
          const saved=stored.heard?.[topic.id];
          if(Array.isArray(saved))state.heard[topic.id]=[...new Set(saved.filter(i=>Number.isInteger(i)&&i>=0&&i<topic.words.length))];
          const cursor=stored.quizCursor?.[topic.id];
          if(Number.isInteger(cursor)&&cursor>=0)state.quizCursor[topic.id]=cursor%topic.words.length;
        }
      }catch{/* A blocked or malformed local store must not prevent play. */}
    }
    function speak(text,element,onUnavailable){
      stopSpeech();
      if(!state.sound){toast('声音已关闭，可以请家长打开，或看看文字提示。');onUnavailable?.();return;}
      if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('这个浏览器暂时不能朗读，可以先看图和文字玩。');onUnavailable?.();return;}
      const token=speechToken;
      const utterance=new SpeechSynthesisUtterance(text);
      const voices=window.speechSynthesis.getVoices();
      const english=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>/^en[-_]US$/i.test(v.lang))||voices.find(v=>/^en\b/i.test(v.lang));
      if(english)utterance.voice=english;
      utterance.lang='en-US';utterance.rate=.8;utterance.pitch=1.08;
      const finish=()=>{if(token===speechToken){clearTimeout(speakingTimer);element?.classList.remove('speaking');}};
      utterance.onstart=()=>{if(token===speechToken)element?.classList.add('speaking');};
      utterance.onend=finish;
      utterance.onerror=event=>{finish();if(token===speechToken&&!['canceled','interrupted'].includes(event.error)){toast('暂时没有播放成功，可以再点一次，或看文字提示。');onUnavailable?.();}};
      try{window.speechSynthesis.speak(utterance);speakingTimer=setTimeout(finish,8000);}catch{finish();toast('朗读暂时不可用，请先看图片和文字。');onUnavailable?.();}
    }
    function markHeard(index){
      const list=state.heard[activeTopic.id] ||= [];
      if(!list.includes(index)){list.push(index);save();}
    }
    function renderLesson(id,page=0,keepOrder=false){
      const topic=TOPICS.find(t=>t.id===id);if(!topic)return;
      if(!keepOrder||activeTopic.id!==id||lessonOrder.length!==topic.words.length){
        const indices=topic.words.map((_,i)=>i);
        lessonOrder=state.learningMode==='random'?shuffle(indices):indices;
      }
      lessonPage=Math.max(0,Math.min(page,Math.ceil(topic.words.length/PAGE_SIZE)-1));
      beginView('lesson');activeTopic=topic;state.lastTopic=topic.id;save();
      app.innerHTML='<div class="back-row"><button class="back-btn" data-action="home">← 返回乐园</button><span id="lesson-progress">'+progressDots(heardCount(topic))+'</span></div>'+
      '<div class="lesson-header"><p class="kicker">'+topic.en.toUpperCase()+' · '+topic.place+'</p><h1>'+topic.zh+'</h1><p><span class="emoji" aria-hidden="true">👆</span> 点一点图片，听听它的英文名字</p></div>'+
      '<div class="lesson-pager"><button class="soft-btn" data-action="page-prev" '+(lessonPage===0?'disabled':'')+'>← 上一组</button><span>'+modeLabel()+' · 第 '+(lessonPage+1)+' / '+Math.ceil(topic.words.length/PAGE_SIZE)+' 组</span><button class="soft-btn" data-action="page-next" '+((lessonPage+1)*PAGE_SIZE>=topic.words.length?'disabled':'')+'>下一组 →</button></div>'+
      '<div class="word-grid" style="--tint:'+topic.tint+'">'+lessonOrder.slice(lessonPage*PAGE_SIZE,(lessonPage+1)*PAGE_SIZE).map(i=>{const word=topic.words[i];return '<button class="word-card" data-action="word" data-index="'+i+'" aria-label="听 '+word[0]+'，'+word[1]+'"><span class="word-sound" aria-hidden="true">♪</span><span class="heard-check" '+((state.heard[topic.id]||[]).includes(i)?'':'hidden')+' aria-label="已探索">✓</span><span class="picture">'+picture(word)+'</span><strong lang="en">'+word[0]+'</strong><small>'+word[1]+'</small></button>';}).join('')+'</div>'+
      '<section class="lesson-bottom"><div><strong>认识新朋友，再玩一个小游戏？</strong><p>每次最多 3 个词 · 完成一组挑战，点亮主题贴纸</p></div><button class="primary" data-action="quiz"><span class="emoji" aria-hidden="true">🎧</span> 听音找朋友 <span class="arrow" aria-hidden="true">→</span></button></section>';
      endView();document.getElementById('announcement').textContent=topic.zh+'，第 '+(lessonPage+1)+' 组';
    }
    function shuffle(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
    function startQuiz(){
      beginView('quiz');
      const pool=activeTopic.words.map((_,i)=>i);
      const cursor=state.quizCursor[activeTopic.id]||0;
      const targets=state.learningMode==='random'?shuffle(pool).slice(0,3):Array.from({length:Math.min(3,pool.length-cursor)},(_,i)=>cursor+i);
      quiz={targets,round:0,answered:false,options:[],optionCount:state.age==='3-4'?2:3,mode:state.learningMode,cursor};
      renderQuiz();
    }
    function renderQuiz(){
      stopSpeech();if(!quiz)return;
      const target=quiz.targets[quiz.round];
      const alternatives=shuffle(activeTopic.words.map((_,i)=>i).filter(i=>i!==target));
      quiz.options=shuffle([target,...alternatives.slice(0,quiz.optionCount-1)]);quiz.answered=false;
      app.innerHTML='<div class="back-row"><button class="back-btn" data-action="lesson">← 回去认一认</button><small>'+activeTopic.zh+'</small></div><section class="quiz-container"><div class="quiz-track"><span class="emoji" aria-hidden="true">🌱</span><div class="track" role="progressbar" aria-label="小游戏进度" aria-valuemin="0" aria-valuemax="'+quiz.targets.length+'" aria-valuenow="'+quiz.round+'"><div class="fill" style="width:'+quiz.round/quiz.targets.length*100+'%"></div></div><small>第 '+(quiz.round+1)+' / '+quiz.targets.length+' 次发现</small><span class="emoji" aria-hidden="true">⭐</span></div>'+
      '<div class="lesson-header"><h1>谁是我的好朋友？</h1><p>听一听英文，点一点下面的图片</p></div><button class="listen-button" data-action="listen"><span class="emoji" aria-hidden="true">🔊</span>再听一遍</button><p id="quiz-hint" hidden></p>'+
      '<div class="quiz-choices" style="--options:'+quiz.optionCount+'">'+quiz.options.map((index)=>'<button class="quiz-choice" data-action="answer" data-index="'+index+'" aria-label="选择'+activeTopic.words[index][1]+'">'+picture(activeTopic.words[index])+'</button>').join('')+'</div>'+
      '<div class="quiz-feedback" id="quiz-feedback" role="status">小耳朵听一听，小手指找一找<small>可以重复听，慢慢来就好</small></div><button class="hint-btn" data-action="hint">看看文字小提示</button><button class="primary quiz-next" data-action="next" hidden>'+(quiz.round===quiz.targets.length-1?'领取我的贴纸 ✧':'找到啦，继续 →')+'</button></section>';
      endView();listenQuiz();
    }
    function listenQuiz(){if(!quiz)return;speak(activeTopic.words[quiz.targets[quiz.round]][0],document.querySelector('.listen-button'),showHint);}
    function showHint(){if(!quiz)return;const word=activeTopic.words[quiz.targets[quiz.round]];const hint=document.getElementById('quiz-hint');if(hint){hint.hidden=false;hint.innerHTML='<strong lang="en">'+word[0]+'</strong> · '+word[1];}}
    function answer(index,button){
      if(!quiz||quiz.answered||!quiz.options.includes(index))return;
      const feedback=document.getElementById('quiz-feedback');
      if(index!==quiz.targets[quiz.round]){
        button.classList.add('retry');setTimeout(()=>button.classList.remove('retry'),600);
        feedback.innerHTML='没关系，我们再听一次 <span class="emoji" aria-hidden="true">🌿</span><small>每一次尝试，都是一个小进步</small>';listenQuiz();return;
      }
      quiz.answered=true;markHeard(index);
      document.querySelectorAll('.quiz-choice').forEach(choice=>choice.disabled=true);
      button.classList.add('correct');button.insertAdjacentHTML('beforeend','<span class="answer-check" aria-hidden="true">✓</span>');
      const word=activeTopic.words[index];feedback.innerHTML='找到啦！<strong lang="en">'+word[0]+'</strong>，'+word[1]+' <span class="emoji" aria-hidden="true">✨</span><small>你的小耳朵真会发现！</small>';
      const next=document.querySelector('[data-action="next"]');next.hidden=false;next.focus({preventScroll:true});
      document.querySelector('.hint-btn').hidden=true;
      document.querySelector('.quiz-track .fill').style.width=(quiz.round+1)/quiz.targets.length*100+'%';
      document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(quiz.round+1));
      speak(word[0],button);
    }
    function nextRound(){if(!quiz?.answered)return;if(quiz.round<quiz.targets.length-1){quiz.round++;renderQuiz();}else renderResult();}
    function renderResult(){
      const rounds=quiz.targets.length;
      if(quiz.mode==='sequential')state.quizCursor[activeTopic.id]=(quiz.cursor+rounds)%activeTopic.words.length;
      const isNew=!state.stickers.includes(activeTopic.id);
      if(isNew)state.stickers.push(activeTopic.id);save();
      beginView('result');
      app.innerHTML='<div class="back-row"><button class="back-btn" data-action="home">← 返回乐园</button><small>每个发现，都值得鼓励</small></div><section class="result"><div class="reward emoji" aria-hidden="true">'+activeTopic.icon+'</div><p class="eyebrow" style="justify-content:center">HIGH FIVE, LITTLE EXPLORER!</p><h1>'+(isNew?'一张新贴纸，送给你！':'又一次发现，真棒！')+'</h1><p>你完成了 '+rounds+' 次听音小挑战<br><strong>「'+activeTopic.sticker+'」</strong>贴纸'+(isNew?'已经放进你的收藏啦':'一直在你的收藏里哦')+'</p><div class="result-actions"><button class="primary" data-action="stickers">看看我的贴纸 <span aria-hidden="true">✧</span></button><button class="soft-btn" data-action="quiz">继续本主题 →</button><button class="soft-btn" data-action="continue-topic">探索下一个小世界 →</button></div><p style="margin-top:24px;font-size:11px">也可以歇一会儿，把新发现讲给家人听。</p></section>';
      endView();document.getElementById('announcement').textContent='真棒！你获得了'+activeTopic.sticker+'贴纸。';
    }
    function renderStickers(){
      beginView('stickers');
      app.innerHTML='<section class="sticker-heading"><p class="eyebrow" style="justify-content:center">MY LITTLE COLLECTION</p><h1>每张贴纸，都是小小的成长</h1><p>去喜欢的小世界玩一玩，收集属于你的快乐</p><div class="sticker-summary"><span class="emoji" aria-hidden="true">⭐</span> 已点亮 <strong>'+state.stickers.length+'</strong> / '+TOPICS.length+' 张贴纸</div></section><div class="sticker-grid">'+TOPICS.map(t=>{const earned=state.stickers.includes(t.id);return '<article class="sticker-card '+(earned?'':'locked')+'" style="--tint:'+t.tint+'"><div class="sticker-circle emoji" aria-hidden="true">'+t.icon+'</div><h3>'+t.sticker+'</h3><small>'+(earned?'✓ 已收藏 · 你的小小成就':'完成听音小游戏就能点亮')+'</small><button data-action="topic" data-topic="'+t.id+'">'+(earned?'再去玩一次 ↗':'去发现吧 →')+'</button></article>';}).join('')+'</div>';
      endView();
    }
    function modalHeader(title){return '<div class="modal-head"><h2 id="modal-title">'+title+'</h2><button class="close-btn" data-action="close" aria-label="关闭弹窗">×</button></div>';}
    function openModal(content){stopSpeech();if(!modal.open)returnFocus=document.activeElement;modalContent.innerHTML=content;if(!modal.open)modal.showModal();}
    function closeModal(){modal.close();}
    function parentGate(){
      const a=12+Math.floor(Math.random()*8),b=4+Math.floor(Math.random()*6);gateAnswer=a+b;
      openModal(modalHeader('这是给大人的小角落')+'<p>请家长帮忙算一算，就可以查看进度和调整设置。</p><form class="gate-form" id="gate-form"><label for="gate-input">'+a+' + '+b+' = ?</label><div class="gate-row"><input id="gate-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="算式答案" aria-describedby="gate-error" required><button class="primary" type="submit">进入</button></div><div class="field-error" id="gate-error" role="status"></div></form><p style="font-size:11px">一个小提醒，帮助孩子把设置交给家长。</p>');
    }
    function renderParents(){
      openModal(modalHeader('陪芽芽，慢慢长大')+'<p>每次选一个喜欢的主题，和孩子一起听、指、玩。</p><div class="parent-stats"><div><strong>'+totalHeard()+' <span style="font-size:12px">/ '+TOTAL_WORDS+'</span></strong><small>探索过的单词</small></div><div><strong>'+state.stickers.length+' <span style="font-size:12px">/ '+TOPICS.length+'</span></strong><small>收获的主题贴纸</small></div></div>'+
      '<div class="setting"><div><strong>英文朗读</strong><small>点击图片或听音按钮时播放</small></div><button class="toggle" role="switch" aria-label="英文朗读" aria-checked="'+state.sound+'" data-action="sound"><span></span></button></div>'+
      '<div class="setting"><div><strong>学习顺序</strong><small>顺序：词卡按顺序展示，挑战逐组往后学。<br>随机：每次进入打乱词卡，挑战随机抽词。<br>继续探索时，也会按所选方式选择主题。</small></div><select id="learning-mode" aria-label="学习顺序"><option value="sequential" '+(state.learningMode==='sequential'?'selected':'')+'>顺序学习</option><option value="random" '+(state.learningMode==='random'?'selected':'')+'>随机学习</option></select></div>'+
      '<div class="setting"><div><strong>小游戏难度</strong><small>年龄仅作参考，可按孩子情况选择</small></div><select id="age-setting" aria-label="小游戏难度"><option value="3-4" '+(state.age==='3-4'?'selected':'')+'>3–4 岁 · 2 选 1</option><option value="5-6" '+(state.age==='5-6'?'selected':'')+'>5–6 岁 · 3 选 1</option></select></div>'+
      '<div class="parent-tip"><p><strong>轻松陪伴的小建议</strong><br>玩一小会儿就可以休息。把屏幕里的新词，变成生活里的小游戏：找找家里的 apple，挥挥自己的 hand。</p></div><p style="font-size:11px">无需账号，不申请麦克风权限。进度只保存在当前浏览器，清除浏览器数据会重置进度。朗读使用设备或浏览器提供的语音，部分语音可能需要联网。</p><button class="soft-btn wide" data-action="test-sound">♪ 试听英文：Hello, little explorer!</button><button class="primary wide" data-action="install">添加到主屏幕 ↗</button><button class="danger-btn" data-action="reset-confirm">重置本机学习进度</button>');
    }
    async function installApp(){
      if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){toast('已经在独立应用中啦！');return;}
      if(pendingInstall){const prompt=pendingInstall;pendingInstall=null;try{await prompt.prompt();const result=await prompt.userChoice;toast(result.outcome==='accepted'?'已提交安装，请查看主屏幕。':'可以随时回到这里添加。');}catch{showInstallHelp();}return;}
      showInstallHelp();
    }
    function showInstallHelp(){
      const local=location.protocol==='file:';
      openModal(modalHeader('把小乐园放到主屏幕')+'<span class="status-tag">随手一点，就能来玩</span>'+(local?'<p>当前通过本地文件打开，可以体验点击交互。添加到主屏幕和离线缓存需要通过 HTTPS 或本机 localhost 服务访问。</p>':'<p>如果浏览器没有弹出安装提示，可以从浏览器菜单手动添加。</p>')+'<ol class="install-list"><li><strong>iPhone / iPad：</strong>在 Safari 的分享菜单中，选择“添加到主屏幕”。</li><li><strong>Android：</strong>在浏览器菜单中，选择“安装应用”或“添加到主屏幕”。</li><li><strong>电脑：</strong>在支持的浏览器地址栏或菜单中，查找安装选项。</li></ol><p style="font-size:11px">支持离线缓存的环境中，首次完整加载后可以离线看图、玩游戏；英语朗读能否离线使用取决于设备语音。</p><button class="primary wide" data-action="parents">知道啦</button>');
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
      switch(button.dataset.action){
        case 'home':renderHome();break;
        case 'start':renderLesson(nextTopicId());break;
        case 'continue-topic':renderLesson(nextTopicId(true));break;
        case 'page-prev':renderLesson(activeTopic.id,lessonPage-1,true);break;
        case 'page-next':renderLesson(activeTopic.id,lessonPage+1,true);break;
        case 'topic':renderLesson(button.dataset.topic);break;
        case 'lesson':renderLesson(activeTopic.id);break;
        case 'word':{const index=Number(button.dataset.index);if(!activeTopic.words[index])break;markHeard(index);button.querySelector('.heard-check').hidden=false;document.getElementById('lesson-progress').innerHTML=progressDots(heardCount(activeTopic));speak(activeTopic.words[index][0],button);break;}
        case 'quiz':startQuiz();break;
        case 'listen':listenQuiz();break;
        case 'hint':showHint();break;
        case 'answer':answer(Number(button.dataset.index),button);break;
        case 'next':nextRound();break;
        case 'stickers':renderStickers();break;
        case 'parent':parentGate();break;
        case 'parents':renderParents();break;
        case 'close':closeModal();break;
        case 'sound':state.sound=!state.sound;save();button.setAttribute('aria-checked',String(state.sound));stopSpeech();break;
        case 'test-sound':speak('Hello, little explorer!',button);break;
        case 'install':installApp();break;
        case 'reset-confirm':openModal(modalHeader('重新开始一段探索？')+'<p>这会清除当前浏览器中探索过的单词和贴纸，声音与难度设置会保留。</p><button class="soft-btn wide" data-action="parents">保留我的进度</button><button class="danger-btn" data-action="reset">确认清除进度</button>');break;
        case 'reset':state.heard={};state.stickers=[];state.quizCursor={};state.lastTopic='animals';save();renderHome();renderParents();toast('进度已重置，可以重新出发啦。');break;
      }
    });
    document.addEventListener('submit',event=>{if(event.target.id!=='gate-form')return;event.preventDefault();const input=document.getElementById('gate-input');if(input.value.trim()!==''&&Number(input.value)===gateAnswer)renderParents();else{document.getElementById('gate-error').textContent='再算一算，请家长帮忙填写哦。';input.value='';input.focus();}});
    document.addEventListener('change',event=>{
      if(event.target.id==='age-setting'){state.age=event.target.value==='5-6'?'5-6':'3-4';save();toast('已保存，下次开始小游戏时生效。');}
      if(event.target.id==='learning-mode'){state.learningMode=event.target.value==='random'?'random':'sequential';lessonModeDirty=true;save();toast('已保存学习顺序，返回词卡或开始下一组挑战时生效。');}
    });
    modal.addEventListener('click',event=>{if(event.target===modal){const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
    modal.addEventListener('close',()=>{stopSpeech();if(lessonModeDirty){lessonModeDirty=false;if(currentView==='lesson')renderLesson(activeTopic.id);}if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else app.focus({preventScroll:true});});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingInstall=event;});
    window.addEventListener('appinstalled',()=>{pendingInstall=null;toast('小乐园已添加到你的设备。');});
    if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol)&&window.isSecureContext){
      window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{/* Core interactions still work without the optional offline cache. */});});
    }
    loadState();renderHome();
  </script>
</body>
</html>
